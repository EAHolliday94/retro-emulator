<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EmulatorJS</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #game { width: 100vw; height: 100vh; display: none; }
        #setup { display: flex; flex-direction: column; gap: 12px; background: #222; padding: 24px; border-radius: 8px; }
        select, input, button { padding: 8px; font-size: 16px; }
    </style>
</head>
<body>
    <div id="setup">
        <label>Select System:
            <select id="system">
                <option value="nes">NES</option>
                <option value="snes">SNES</option>
                <option value="gba">Game Boy Advance</option>
                <option value="gb">Game Boy / GBC</option>
                <option value="n64">Nintendo 64</option>
                <option value="nds">Nintendo DS</option>
                <option value="segaMD">Sega Genesis / Mega Drive</option>
                <option value="psx">PlayStation 1</option>
            </select>
        </label>
        <label>Select ROM File:
            <input type="file" id="rom-input" />
        </label>
        <button id="start-btn">Launch Game</button>
    </div>

    <div id="game"></div>

    <script>
        document.getElementById('start-btn').addEventListener('click', () => {
            const file = document.getElementById('rom-input').files[0];
            if (!file) return alert('Please select a ROM file first.');

            window.EJS_player = '#game';
            window.EJS_core = document.getElementById('system').value;
            window.EJS_gameUrl = URL.createObjectURL(file);
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

            document.getElementById('setup').style.display = 'none';
            document.getElementById('game').style.display = 'block';

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
